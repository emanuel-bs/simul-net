name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # O base path acompanha o nome do repositório: https://usuario.github.io/<repositório>/
          VITE_BASE: /${{ github.event.repository.name }}/
      # Testes de ponta a ponta: percorrem todos os cenários de todos os simuladores em um Chrome real (já instalado no runner).
      - name: Testes de ponta a ponta
        run: npx playwright test
        env:
          E2E_BASE: /${{ github.event.repository.name }}/
      - name: Guardar o relatório se os testes falharem
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
